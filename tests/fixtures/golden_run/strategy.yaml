strategy_name: "Golden_EMA_Crossover"
parameters:
  ema_fast_length: 3
  ema_slow_length: 6
features:
  - name: ema_fast
    type: EMA
    params:
      length: ${ema_fast_length}
    source: close
  - name: ema_slow
    type: EMA
    params:
      length: ${ema_slow_length}
    source: close
overlays: [ema_fast, ema_slow]
long_entry_rules:
  - all_of:
      - condition: is_above
        left:
          ref: ema_fast
        right:
          ref: ema_slow
long_exit_rules:
  - any_of:
      - condition: cross_below
        left:
          ref: ema_fast
        right:
          ref: ema_slow
short_entry_rules:
  - all_of:
      - condition: is_below
        left:
          ref: ema_fast
        right:
          ref: ema_slow
short_exit_rules:
  - any_of:
      - condition: cross_above
        left:
          ref: ema_fast
        right:
          ref: ema_slow
