# Global features that are ALWAYS included in every backtest context.
# This feature set is designed to provide a rich, multi-timeframe view of
# market trend, momentum, volatility, and volume.
#
# Feature names MUST have a timeframe prefix (15min_, 1h_, 4h_, 1d_).

features:
  # --- Trend Indicators ---
  # Provide a view of the trend across major timeframes.
  - name: "1h_ema_50"
    type: "EMA"
    params: { "length": 50 }
    timeframe: "1H"
  - name: "4h_ema_50"
    type: "EMA"
    params: { "length": 50 }
    timeframe: "4H"
  - name: "1d_ema_24"
    type: "EMA"
    params: { "length": 24 }
    timeframe: "1D"
  - name: "1h_adx_14"
    type: "ADX"
    params: { "length": 14 }
    timeframe: "1H"

  # --- Momentum Indicators ---
  # Measure the speed and change of price movements.
  - name: "15min_rsi_14"
    type: "RSI"
    params: { "length": 14 }
    timeframe: "15min"
  - name: "1h_rsi_14"
    type: "RSI"
    params: { "length": 14 }
    timeframe: "1H"
  - name: "4h_rsi_14"
    type: "RSI"
    params: { "length": 14 }
    timeframe: "4H"
  - name: "1h_macd"
    type: "MACD"
    params: { "fast": 12, "slow": 26, "signal": 9 }
    timeframe: "1H"

  # --- Volatility Indicators ---
  # Measure the magnitude of price fluctuations.
  - name: "15min_atr_14"
    type: "ATR"
    params: { "length": 14 }
    timeframe: "15min"
  - name: "1h_atr_14"
    type: "ATR"
    params: { "length": 14 }
    timeframe: "1H"
  - name: "4h_atr_14"
    type: "ATR"
    params: { "length": 14 }
    timeframe: "4H"
  - name: "1d_atr_14"
    type: "ATR"
    params: { "length": 14 }
    timeframe: "1D"
  - name: "1h_bb_width_20"
    type: "BBWidth"
    params: { "length": 20, "ndev": 2.0 }
    timeframe: "1H"

  # --- Volume Indicators ---
  # Measure market participation and conviction.
  - name: "1h_volume_sma_20"
    type: "SMA"
    params: { "length": 20 }
    source: "volume"
    timeframe: "1H"
  - name: "1d_volume_sma_20"
    type: "SMA"
    params: { "length": 20 }
    source: "volume"
    timeframe: "1D"
