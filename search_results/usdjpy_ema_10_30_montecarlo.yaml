user_id: "ai_search"
runs_dir: "runs"
initial_cash: 100000
position_size: 50000
warmup_bars: 100
entry_window_bars: 3
tie_break_policy:
  rule: "stop_then_tp"

cost_model:
  spread_per_unit: 0.00015
  slippage_per_unit: 0.0
  commission:
    type: "per_unit"
    value: 0.0

data_request:
  symbol: "USD_JPY"
  timeframe: "1H"
  start: "2013-01-01"
  end: "2025-09-26"

strategy_path: "config/strategy/ema_crossover.yaml"
rem_path: "config/rem/trailing_stops.yaml"

# Monte Carlo perturbation testing
monte_carlo:
  mode: "bar_resimulation"
  trials: 10
  seed: 42
  cost_jitter:
    spread_jitter_pct: 0.1
    slippage_jitter_pct: 0.1
  perturbation:
    mode: "gaussian"
    std_pct: 0.001

strategy_params:
  ema_fast_length: 10
  ema_slow_length: 30
  slope_filter: false
