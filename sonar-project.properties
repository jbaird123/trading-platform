# Root project file for SonarCloud analysis.

# Unique key for the project. This should match the one on SonarCloud.
sonar.projectKey=jbaird123_trading-platform

# Organization key. This should match your GitHub organization/username.
sonar.organization=jbaird123-gh

## Limit sources to the package dir to avoid indexing tests twice
sonar.sources=src/trading_platform
sonar.tests=tests
sonar.python.version=3.10
sonar.python.coverage.reportPaths=coverage.xml
sonar.coverage.exclusions=src/trading_platform/core/demo.py, **/__init__.py
sonar.exclusions=src/trading_platform/core/demo.py
