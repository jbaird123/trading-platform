[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "trading-platform"
version = "0.0.1"
description = "A modular trading platform for strategy development and backtesting."
authors = ["Joe Baird <jbaird123@gmail.com>"]
readme = "README.md"
packages = [{include = "trading_platform", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.12"
pydantic = "^2.7.1"
pandas = "^2.2.2"
jsonschema = "^4.23.0"
pyyaml = "^6.0.1"
dash = "^3.2.0"
plotly = "^6.3.0"
pyarrow = "^16.1.0"
lightgbm = "^4.6.0"
scikit-learn = "^1.7.2"
shap = "^0.48.0"
mlflow-skinny = "^3.4.0"
scipy = "^1.16.2"
skl2onnx = "^1.16.0"
fastapi = "^0.111.0"
uvicorn = {extras = ["standard"], version = "^0.30.1"}
pandas-ta = "^0.4.71b0"
joblib = "^1.5.2"
google-generativeai = "^0.8.5"
statsmodels = "^0.14.5"
requests = "^2.31.0"
dukascopy-python = "^4.0.1"
openai = "^1.58.1"
anthropic = "^0.40.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-cov = "^5.0.0"
pytest-bdd = "^7.0.0"
pytest-mock = "^3.12.0"
ruff = "^0.4.4"
mypy = "^1.10.0"
pre-commit = "^3.7.1"
pandas-stubs = "^2.2.2.240416"
types-jsonschema = "^4.25.1.20250822"
hypothesis = "^6.0"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = [
    "E",    # pycodestyle errors
    "F",    # pyflakes
    "W",    # pycodestyle warnings
    "I",    # isort
    "UP",   # pyupgrade
    "BLE",  # blind except - catches overly broad exception handlers
    "TRY",  # tryceratops - exception handling anti-patterns
]

# Exception handling rules - enforce fail-fast principle
ignore = [
    "BLE001",  # Do not catch blind exception - we use Exception with logging intentionally for optional features
    "TRY003",  # Avoid specifying long messages outside exception class (too strict)
    "TRY004",  # Prefer TypeError - too opinionated, we use ValueError appropriately
    "TRY300",  # Consider else block - stylistic preference, doesn't affect safety
    "TRY400",  # Use logging.exception instead of logging.error (we use both appropriately)
]

[tool.mypy]
python_version = "3.12"
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
check_untyped_defs = true
warn_unused_ignores = true
show_error_codes = true

[[tool.mypy.overrides]]
module = [
    "scipy.*",
    "sklearn.*",
    "pandas_ta.*",
    "yaml",
    "skl2onnx.*",
    "lightgbm.*",
    "shap.*",
    "mlflow.*",
    "plotly.*",
    "uvicorn.*",
    "starlette.*",
    "multipart.*",
    "httpx.*",
    "joblib",
    "google.*",
    "statsmodels.*",
    "dukascopy_python",
    "pyarrow",
    "openai",
    "anthropic",
]
ignore_missing_imports = true


[tool.pytest.ini_options]
testpaths = ["tests"]
# Ignore the benign "usefixtures" warning from pytest-bdd's scenario generator
filterwarnings = [
    "ignore:usefixtures.*has no effect:pytest.PytestWarning",
    # Third-party onnx library emits a DeprecationWarning from skl2onnx; harmless for our tests, ignore it.
    "ignore:Field onnx.AttributeProto.ints:DeprecationWarning:onnx.helper",
    # Third-party starlette library emits a PendingDeprecationWarning; harmless for our tests, ignore it.
    "ignore:Please use `import python_multipart` instead.:PendingDeprecationWarning:starlette.formparsers",
    # pandas occasionally re-imports NumPy in the sandboxed test environment.
    "ignore:The NumPy module was reloaded.*:UserWarning",
    # Pandas internal downcasting warnings in test code - will be resolved when pandas removes this behavior
    "ignore:Downcasting object dtype arrays.*:FutureWarning",
    "ignore:Setting an item of incompatible dtype is deprecated:FutureWarning:tests.conftest",
]
markers = [
    "slow: Marks a test as slow-running (e.g., performance benchmarks).",
    "req_DH_2_1: Marks a test as covering a specific requirement.",
    "req_DH_2_2: Marks a test as covering a specific requirement.",
    "req_DH_2_3: Marks a test as covering a specific requirement.",
    "req_DH_2_4: Marks a test as covering a specific requirement.",
    "req_DH_2_5: Marks a test as covering a specific requirement.",
    "req_DH_2_6: Marks a test as covering a specific requirement.",
    "req_RMM_4_1: Marks a test as covering a specific requirement.",
    "req_RMM_4_2: Marks a test as covering a specific requirement.",
    "req_RMM_4_3: Marks a test as covering a specific requirement.",
    "req_SE_3_1: Marks a test as covering a specific requirement.",
    "req_SE_3_2: Marks a test as covering a specific requirement.",
    "req_BT_7_1: Marks a test as covering a specific requirement.",
    # Additional BDD tags used in feature files
    "req_BT_7_3: Marks a test as covering a specific requirement.",
    "req_BT_7_6: Marks a test as covering a specific requirement.",
    "req_BT_7_7: Marks a test as covering a specific requirement.",
    "req_BT_7_9: Marks a test as covering a specific requirement.",
    "req_BT_7_10: Marks a test as covering a specific requirement.",
    "req_BT_7_11: Marks a test as covering a specific requirement.",
    "req_BT_7_16: Marks a test as covering a specific requirement.",
]

[tool.poetry.scripts]
tp = "trading_platform.cli:main"
