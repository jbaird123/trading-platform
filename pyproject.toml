[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "trading-platform"
version = "0.0.1"
description = "Trading Platform MVP"
authors = ["Your Name <you@example.com>"]
readme = "README.md"
packages = [{include = "trading_platform", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.10"
pydantic = "^2.7.1"
pandas = "^2.2.2"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-cov = "^5.0.0"
pytest-bdd = "^7.0.0"
ruff = "^0.4.4"
mypy = "^1.10.0"
pre-commit = "^3.7.1"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
packages = ["src/trading_platform"]

[tool.pytest.ini_options]
# Ignore the benign "usefixtures" warning from pytest-bdd's scenario generator
filterwarnings = ["ignore:usefixtures.*has no effect:pytest.PytestWarning"]
