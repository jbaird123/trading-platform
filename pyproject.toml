[build-system]
requires = ["poetry-core>=1.0.0"]
build-backend = "poetry.core.masonry.api"

[tool.poetry]
name = "trading-platform"
version = "0.0.1"
description = "A modular trading platform for strategy development and backtesting."
authors = ["Joe Baird <jbaird123@gmail.com>"]
readme = "README.md"
packages = [{include = "trading_platform", from = "src"}]

[tool.poetry.dependencies]
python = ">=3.10"
pydantic = "^2.7.1"
pandas = "^2.2.2"
ta = "^0.11.0"

[tool.poetry.group.dev.dependencies]
pytest = "^8.2.0"
pytest-cov = "^5.0.0"
pytest-bdd = "^7.0.0"
ruff = "^0.4.4"
mypy = "^1.10.0"
pre-commit = "^3.7.1"
pandas-stubs = "^2.2.2.240416"

[tool.ruff]
line-length = 88

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP"]

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
mypy_path = "src"
packages = ["trading_platform"]

[tool.pytest.ini_options]
# Ignore the benign "usefixtures" warning from pytest-bdd's scenario generator
filterwarnings = ["ignore:usefixtures.*has no effect:pytest.PytestWarning"]
markers = [
    "req_DH_2_2: Marks a test as covering a specific requirement.",
    "req_DH_2_3: Marks a test as covering a specific requirement.",
    "req_DH_2_5: Marks a test as covering a specific requirement.",
    "req_DH_2_6: Marks a test as covering a specific requirement.",
    "req_RMM_4_1: Marks a test as covering a specific requirement.",
    "req_RMM_4_2: Marks a test as covering a specific requirement.",
    "req_RMM_4_3: Marks a test as covering a specific requirement.",
    "req_SE_3_1_2: Marks a test as covering a specific requirement.",
    "req_SE_3_2_1: Marks a test as covering a specific requirement.",
    "req_BT_6_1: Marks a test as covering a specific requirement.",
    "req_BT_6_2: Marks a test as covering a specific requirement.",
    "req_BT_6_3: Marks a test as covering a specific requirement.",
    "req_BT_6_4: Marks a test as covering a specific requirement.",
    "req_BT_6_8: Marks a test as covering a specific requirement.",
]
