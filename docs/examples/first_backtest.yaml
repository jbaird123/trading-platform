strategy_name: "My Real Strategy"
features:
  - name: ema_fast
    type: EMA
    params:
      length: 21
    source: close
  - name: ema_slow
    type: EMA
    params:
      length: 50
    source: close
  - name: rsi
    type: RSI
    params:
      length: 14
    source: close
  - name: adx
    type: ADX
    params:
      length: 14
  - name: bb_width
    type: BBWidth
    params:
      length: 20
      ndev: 2.0
    source: close
overlays:
  - ema_fast
  - ema_slow
long_entry_rules:
  - all_of:
      - condition: is_above
        left:
          ref: ema_fast
        right:
          ref: ema_slow
      - condition: is_above
        left:
          ref: adx
        right: 20
      - condition: is_below
        left:
          ref: bb_width
        right: 0.3
long_exit_rules:
  - any_of:
      - condition: is_below
        left:
          ref: ema_fast
        right:
          ref: ema_slow
      - condition: is_below
        left:
          ref: rsi
        right: 30
  - stop_loss:
      value: 0.0150
      type: price
short_entry_rules:
  - all_of:
      - condition: is_below
        left:
          ref: ema_fast
        right:
          ref: ema_slow
      - condition: is_below
        left:
          ref: adx
        right: 20
      - condition: is_below
        left:
          ref: bb_width
        right: 0.3
short_exit_rules:
  - any_of:
      - condition: is_above
        left:
          ref: ema_fast
        right:
          ref: ema_slow
      - condition: is_above
        left:
          ref: rsi
        right: 70
  - stop_loss:
      value: 0.0150
      type: price
