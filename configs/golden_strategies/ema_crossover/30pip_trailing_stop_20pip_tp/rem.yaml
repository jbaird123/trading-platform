name: "Trailing_30pip_Stop_20pip_TP"
version: "1.0"
description: "30-pip trailing stop loss + 20-pip take profit for golden validation"

# Trailing stop loss: 30 pips
# For EURUSD: 30 pips = 0.0030 in canonical price terms
# Trails behind the peak (for longs) or trough (for shorts)
trailing_stop:
  price_offset: 0.0030

# Take profit: 20 pips
# For EURUSD: 20 pips = 0.0020 in canonical price terms
# Fixed distance from entry price
take_profit:
  price_offset: 0.0020
