run_id: "EMA_Crossover_20pip_Trailing_Stop_Golden_Validation"

# Match TradingView backtest configuration exactly
initial_cash: 100000.0
position_size: 10000.0  # $10k per trade

# Instrument configuration
instrument:
  symbol: "EURUSD"

# Execution model (how entries/exits are filled)
execution_model: "next_bar_open"  # REQUIRED - matches TradingView behavior

# Exit tie-break: stop-loss has priority over take-profit
exit_tie_break: "stop_then_tp"

# Warmup period (bars to skip before generating trades)

# Random seed for reproducibility
run_seed: 42
