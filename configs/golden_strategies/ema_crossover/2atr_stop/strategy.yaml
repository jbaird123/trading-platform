strategy_name: "EMA_Crossover_2ATR_Stop"
description: "EMA crossover with dynamic ATR-based stops for golden validation"
version: "1.0"

parameters:
  ema_fast_length: 20
  ema_slow_length: 50

features:
  - name: ema_fast
    type: EMA
    params:
      length: ${ema_fast_length}
    source: close

  - name: ema_slow
    type: EMA
    params:
      length: ${ema_slow_length}
    source: close

overlays: [ema_fast, ema_slow]

long_entry_rules:
  - all_of:
      - condition: cross_above
        left:
          ref: ema_fast
        right:
          ref: ema_slow

long_exit_rules:
  - any_of:
      - condition: cross_below
        left:
          ref: ema_fast
        right:
          ref: ema_slow

short_entry_rules:
  - all_of:
      - condition: cross_below
        left:
          ref: ema_fast
        right:
          ref: ema_slow

short_exit_rules:
  - any_of:
      - condition: cross_above
        left:
          ref: ema_fast
        right:
          ref: ema_slow
