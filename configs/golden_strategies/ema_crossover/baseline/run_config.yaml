user_id: "golden_validation_ema_crossover"
initial_cash: 100000
position_size: 10000  # Fixed $10k per trade
execution_model: "next_bar_open"  # Realistic execution model (matches TradingView)

instrument:
  symbol: "EURUSD"

# No transaction costs for baseline validation
cost_model:
  spread_per_unit: 0.0
  slippage_per_unit: 0.0
  commission: 0.0

data_request:
  symbol: "EURUSD"
  timeframe: "1H"
  start: "2023-01-01"
  end: "2024-12-31"

tie_break_policy:
  rule: "stop_then_tp"
