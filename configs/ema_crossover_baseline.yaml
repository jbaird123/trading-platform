user_id: "researcher"
runs_dir: "runs"
initial_cash: 100000
warmup_bars: 50
tie_break_policy:
  rule: "stop_then_tp"

# Data source is owned by the Data Handler. This run config
# declares only the intent of what to request.
data_request:
  symbol: "EUR_USD"
  timeframe: "1H"
  start: "2014-01-01"
  end: "2023-03-01"

#fast_mode:
#  limit_bars: 5000

rem_path: "config/rem/basic_price_exits.yaml"

strategy_path: "config/strategy/ema_crossover.yaml"

# Optional: per-run overrides to strategy tunables
# Example: adjust EMA lengths without editing the strategy file
strategy_overrides:
  features:
    ema_fast:
      length: 16
    ema_slow:
      length: 50

# Regime Market Manager (mandatory) - referenced by path
rmm_path: "config/rmm/daily_trend.yaml"
