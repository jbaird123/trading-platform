user_id: "researcher"
initial_cash: 100000
position_size: 50000
entry_window_bars: 3
tie_break_policy:
  rule: "stop_then_tp"

# Transaction costs
cost_model:
  spread_per_unit: 0.00015
  slippage_per_unit: 0.0
  commission:
    type: "per_unit"
    value: 0.0

# Data - Just 1 year for testing
data_request:
  symbol: "EUR_USD"
  timeframe: "1H"
  start: "2024-01-01"
  end: "2025-01-01"

strategy_path: "config/strategy/ema_crossover.yaml"
rem_path: "config/rem/trailing_stops.yaml"
rmm_path: "config/rmm/4h_trend.yaml"

# Monte Carlo only
monte_carlo:
  mode: "bar_resimulation"
  trials: 2
  seed: 42
  cost_jitter:
    spread_jitter_pct: 0.1
    slippage_jitter_pct: 0.1
    per_trade_cost_jitter_pct: 0.05
  perturbation:
    mode: "block"
    block_len: 8
    std_pct: 0.001

# Winner params
strategy_params:
  ema_fast_length: 20
  ema_slow_length: 80
  slope_filter: false
