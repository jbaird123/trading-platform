user_id: "researcher"
initial_cash: 100000
entry_window_bars: 3  # Allow entry within 3 bars of signal transition
tie_break_policy:
  rule: "stop_then_tp"
position_size: 50000  # Iteration 9: 2x size to amplify edge

# Transaction costs configuration
cost_model:
  spread_per_unit: 0.00015  # 1.5 pips for EUR/USD ($0.00015 per dollar)
  slippage_per_unit: 0.0    # No additional slippage for now
  commission:
    type: "per_unit"         # Per unit commission
    value: 0.0               # No additional commission for now

# Data source configuration
# Instrument metadata is automatically derived from this
data_request:
  symbol: "EUR_USD"
  timeframe: "1H"
  start: "2013-01-01"
  end: "2025-09-26"

counterfactual_mode: exact   # fast | exact; default is fast
# For fast mode, add: fast_mode: {limit_bars: 10000}

# Post-exit price tracking for exit efficiency analysis
post_exit_analysis:
  enabled: true
  horizons: [10, 20, 50]  # Track price movement for N bars after each exit

rem_path: "config/rem/trailing_stops.yaml"
strategy_path: "config/strategy/ema_crossover.yaml"

# Strategy parameters for this run (for brief reporting)
# Iteration 8: Widen EMA separation to reduce whipsaw
strategy_params:
  ema_fast_length: 12
  ema_slow_length: 50
  slope_filter: false

# Optional: per-run overrides to strategy tunables (for execution)
strategy_overrides:
  features:
    ema_fast:
      length: 12
    ema_slow:
      length: 50

# Regime Market Manager - Iteration 10: Disable to test trade frequency
rmm_path: "config/rmm/4h_trend.yaml"
