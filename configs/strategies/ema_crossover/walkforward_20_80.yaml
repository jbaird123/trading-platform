user_id: "researcher"
initial_cash: 100000
position_size: 50000
entry_window_bars: 3
tie_break_policy:
  rule: "stop_then_tp"

# Transaction costs configuration
cost_model:
  spread_per_unit: 0.00015  # 1.5 pips for EUR/USD
  slippage_per_unit: 0.0
  commission:
    type: "per_unit"
    value: 0.0

# Data source - Full 12 years
data_request:
  symbol: "EUR_USD"
  timeframe: "1H"
  start: "2013-01-01"
  end: "2025-09-26"

strategy_path: "config/strategy/ema_crossover.yaml"
rem_path: "config/rem/trailing_stops.yaml"
rmm_path: "config/rmm/4h_trend.yaml"

# Walk-forward analysis on winner (20/80 EMAs)
walk_forward:
  train_months: 12
  test_months: 6
  step_months: 3
  min_train_months: 12

# Strategy parameters - winner configuration
strategy_params:
  ema_fast_length: 20
  ema_slow_length: 80
  slope_filter: false
