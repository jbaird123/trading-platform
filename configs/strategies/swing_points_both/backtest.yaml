# Run configuration for the Swing Points Both Sides strategy backtest

user_id: "backtest_user"
run_seed: 42
log_level: "INFO"
initial_cash: 10000.0
position_size: 10000.0

# Strategy Configuration
strategy_path: "config/strategy/swing_points_both.yaml"

# Risk & Exit Manager Configuration
rem_path: "config/rem/trailing_stops.yaml"

# Data Request
data_request:
  symbol: "EURUSD"
  timeframe: "1h"
  start: "2013-01-01"
  end: "2025-09-25"

# Instrument Definitions (required by backtester)
instrument_definitions:
  EURUSD:
    symbol: "EURUSD"
    tick_size: 0.0001
    base_ccy: "EUR"
    quote_ccy: "USD"

# Transaction costs configuration
cost_model:
  spread_per_unit: 0.00015  # 1.5 pips for EUR/USD
  slippage_per_unit: 0.0    # No additional slippage for now
  commission:
    type: "per_unit"
    value: 0.0

# Fill and Tie-break Policies
fill_policy:
  policy: "market"
tie_break_policy:
  rule: "stop_then_tp"
