repos:
  - repo: https://github.com/pre-commit/pre-commit-hooks
    rev: v4.6.0
    hooks:
      - id: trailing-whitespace
      - id: end-of-file-fixer
      - id: check-yaml
      - id: check-added-large-files

  - repo: https://github.com/astral-sh/ruff-pre-commit
    rev: v0.4.4
    hooks:
      - id: ruff
        args: [--fix, --exit-non-zero-on-fix]
      - id: ruff-format
        args: [--line-length=88]

  - repo: https://github.com/pre-commit/mirrors-mypy
    rev: v1.10.0
    hooks:
      - id: mypy
        language: system
        entry: poetry run mypy
        pass_filenames: false
        args:
          - src
          - tests

  - repo: local
    hooks:
      - id: strategy-risk-separation-check
        name: Check for risk logic in strategy files
        entry: tools/check_strategy_risk_separation.py
        language: python
        types: [yaml]
        files: ^config/strategy/.*\.yaml$
      - id: block-ta-import
        name: Block import of ta library
        entry: bash -c 'grep -l "import ta" "$@" | xargs -r false' --
        language: system
        types: [python]

      - id: block-src-import
        name: Block import from src. in Python files
        entry: bash -c 'grep -l "import src\." "$@" | xargs -r false' --
        language: system
        types: [python]

      # Temporarily disabled during defensive code refactoring
      # - id: targeted-coverage
      #   name: Enforce 100% coverage for staged source files
      #   entry: poetry run python tools/check_changed_coverage.py
      #   language: system
      #   pass_filenames: false
      #   always_run: true
