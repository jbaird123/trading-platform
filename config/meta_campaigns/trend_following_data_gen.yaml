# config/meta_campaigns/trend_following_data_gen.yaml

meta_campaign_id: trend_following_model_generation
description: "Generates all campaign configs needed to train all trend-following models."

run_grid:
  date_ranges:
    - { start: "2018-01-01", end: "2023-12-31" }
  instruments:
    - EUR_USD
  execution_timeframes:
    - 5min
    - 15min
    - 1H
    - 4H
    - 1D

strategy_profiles:
  # Profile for data WITH defined risk.
  - name: trend_with_risk
    strategy_path: config/master_data_generation/strategies/ema_crossover_v1.yaml
    rem_path: config/master_data_generation/rem/chandelier_stop_v1.yaml
    archetype: trend_following
    param_grid:
      # Fast crossover, tighter chandelier stop
      - strategy_params: { fast_length: 5, slow_length: 20 }
        rem_params: { atr_length: 14, atr_multiplier: 1.8 }
      # Classic MACD-style crossover
      - strategy_params: { fast_length: 12, slow_length: 26 }
        rem_params: { atr_length: 22, atr_multiplier: 2.2 }
      # Baseline crossover with wider trail
      - strategy_params: { fast_length: 10, slow_length: 20 }
        rem_params: { atr_length: 22, atr_multiplier: 2.0 }
      # Baseline crossover with loose trail for trend following
      - strategy_params: { fast_length: 10, slow_length: 20 }
        rem_params: { atr_length: 22, atr_multiplier: 3.2 }
      # Slower crossover, medium trail
      - strategy_params: { fast_length: 20, slow_length: 50 }
        rem_params: { atr_length: 14, atr_multiplier: 2.5 }
      # Slower crossover with very loose trail
      - strategy_params: { fast_length: 20, slow_length: 80 }
        rem_params: { atr_length: 18, atr_multiplier: 3.5 }
      # Alternative stop style: fixed ATR multiple, no chandelier projection
      - strategy_params: { fast_length: 12, slow_length: 40 }
        rem_params:
          type: atr_multiple
          atr_length: 14
          atr_multiplier: 2.0

  # Profile for data WITHOUT defined risk.
  - name: baseline_no_risk
    strategy_path: config/master_data_generation/strategies/ema_crossover_v1.yaml
    rem_path: null
    archetype: trend_following
    param_grid:
      - strategy_params: { fast_length: 9, slow_length: 21 }
      - strategy_params: { fast_length: 15, slow_length: 45 }
      - strategy_params: { fast_length: 12, slow_length: 26 }
      - strategy_params: { fast_length: 5, slow_length: 20 }
