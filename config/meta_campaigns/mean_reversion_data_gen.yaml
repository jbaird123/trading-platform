# config/meta_campaigns/mean_reversion_data_gen.yaml

meta_campaign_id: mean_reversion_model_generation
description: "Generates all campaign configs needed to train mean reversion models (Bollinger Bands)."

run_grid:
  date_ranges:
    - { start: "2018-01-01", end: "2023-12-31" }
  instruments:
    - EURUSD
  execution_timeframes:
    - 5min
    - 15min
    - 1H
    - 4H
    - 1D

strategy_profiles:
  # Profile for data WITH defined risk (ATR stop).
  - name: bb_with_risk
    strategy_path: config/master_data_generation/strategies/bb_mean_reversion_v1.yaml
    rem_path: config/master_data_generation/rem/atr_stop_v1.yaml
    archetype: mean_reversion
    param_grid:
      # Standard BB (20, 2.0) with varying stop tightness
      - strategy_params: { bb_length: 20, bb_std_dev: 2.0 }
        rem_params: { multiplier: 1.5 }
      - strategy_params: { bb_length: 20, bb_std_dev: 2.0 }
        rem_params: { multiplier: 2.0 }
      - strategy_params: { bb_length: 20, bb_std_dev: 2.0 }
        rem_params: { multiplier: 2.5 }
      # Tighter bands (2.5 std) - fewer but higher conviction entries
      - strategy_params: { bb_length: 20, bb_std_dev: 2.5 }
        rem_params: { multiplier: 2.0 }
      # Wider bands (1.5 std) - more frequent entries
      - strategy_params: { bb_length: 20, bb_std_dev: 1.5 }
        rem_params: { multiplier: 2.0 }
      # Shorter lookback (faster BB)
      - strategy_params: { bb_length: 10, bb_std_dev: 2.0 }
        rem_params: { multiplier: 1.5 }
      - strategy_params: { bb_length: 10, bb_std_dev: 2.0 }
        rem_params: { multiplier: 2.0 }
      # Longer lookback (slower BB)
      - strategy_params: { bb_length: 30, bb_std_dev: 2.0 }
        rem_params: { multiplier: 2.0 }
      - strategy_params: { bb_length: 30, bb_std_dev: 2.5 }
        rem_params: { multiplier: 2.5 }

  # Profile for data WITHOUT defined risk (signal-only exit).
  - name: bb_no_risk
    strategy_path: config/master_data_generation/strategies/bb_mean_reversion_v1.yaml
    rem_path: null
    archetype: mean_reversion
    param_grid:
      - strategy_params: { bb_length: 10, bb_std_dev: 2.0 }
      - strategy_params: { bb_length: 20, bb_std_dev: 2.0 }
      - strategy_params: { bb_length: 20, bb_std_dev: 2.5 }
      - strategy_params: { bb_length: 30, bb_std_dev: 2.0 }
