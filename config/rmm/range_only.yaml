name: "Range-Only Filter"
version: "1.0"
timeframe: "1H"

features:
  - name: "adx"
    type: "ADX"
    params:
      length: 14
    source: "close"

regimes:
  - label: "range"
    confidence: 0.9
    conditions:
      all_of:
        - condition: "is_below"
          left: { ref: "adx" }
          right: 25  # ADX < 25 indicates ranging market

  # Default: if ADX >= 25, label as "trending" (will be filtered out)
  - label: "trending"
    confidence: 0.8
    conditions:
      all_of:
        - condition: "is_above"
          left: { ref: "adx" }
          right: 25

policy:
  min_confidence: 0.5
  allow_labels: ["range"]  # Only trade when market is ranging
