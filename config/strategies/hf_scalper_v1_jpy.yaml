strategy_name: HF_Scalper_V1
features:
  - name: rsi_2
    type: RSI_SMA
    params:
      length: 2
  - name: bb_20_3
    type: BB
    params:
      length: 20
      std: 3.0
  - name: atr_14
    type: ATR
    params:
      length: 14

parameters:
  vol_threshold: 0.0004

long_entry_rules:
  - all_of:
      - condition: is_below
        left:
          field: close
        right:
          ref: bb_20_3_lower
      - condition: is_below
        left:
          ref: rsi_2
        right:
          value: 5
      - condition: is_above
        left:
          ref: atr_14
        right:
          value: 0.04

long_exit_rules:
  - any_of:
      - condition: is_above
        left:
          field: close
        right:
          ref: bb_20_3_upper

short_entry_rules:
  - all_of:
      - condition: is_above
        left:
          field: close
        right:
          ref: bb_20_3_upper
      - condition: is_above
        left:
          ref: rsi_2
        right:
          value: 95
      - condition: is_above
        left:
          ref: atr_14
        right:
          value: 0.04

short_exit_rules:
  - any_of:
      - condition: is_below
        left:
          field: close
        right:
          ref: bb_20_3_lower

overlays:
  - bb_20_3_upper
  - bb_20_3_lower
  - bb_20_3_middle
