strategy_name: "EMA_Crossover_Generic"
parameters:
  ema_fast_length: 12
  ema_slow_length: 26
features:
  - name: ema_fast
    type: EMA
    params:
      length: 12
    source: close
  - name: ema_slow
    type: EMA
    params:
      length: 26
    source: close
overlays: [ema_fast, ema_slow]
long_entry_rules:
  - all_of:
      - condition: is_above
        left:
          ref: ema_fast
        right:
          ref: ema_slow
long_exit_rules:
  - any_of:
      - condition: cross_below
        left:
          ref: ema_fast
        right:
          ref: ema_slow
short_entry_rules:
  - all_of:
      - condition: is_below
        left:
          ref: ema_fast
        right:
          ref: ema_slow
short_exit_rules:
  - any_of:
      - condition: cross_above
        left:
          ref: ema_fast
        right:
          ref: ema_slow
