# Global features that are ALWAYS included in every backtest context.
# This feature set is designed to provide a rich, multi-timeframe view of
# market trend, momentum, volatility, and volume.
#
# Feature names MUST have a timeframe prefix (15min_, 1h_, 4h_, 1d_).

features:
  # --- Micro Trend Indicators (5min) ---
  # Provide faster context for intraday strategies.
  - name: "5min_ema_50"
    type: "EMA"
    params: { "length": 50 }
    timeframe: "5min"
  - name: "5min_ema_50_slope_pct"
    type: "EMASlopePct"
    params: { "length": 50, "slope_period": 1 }
    timeframe: "5min"
  - name: "5min_ema_20"
    type: "EMA"
    params: { "length": 20 }
    timeframe: "5min"
  - name: "5min_ema_20_slope_pct"
    type: "EMASlopePct"
    params: { "length": 20, "slope_period": 1 }
    timeframe: "5min"
  - name: "5min_ema_100"
    type: "EMA"
    params: { "length": 100 }
    timeframe: "5min"
  - name: "5min_ema_100_slope_pct"
    type: "EMASlopePct"
    params: { "length": 100, "slope_period": 1 }
    timeframe: "5min"
  - name: "5min_ema_50_distance_pct"
    type: "EMADistancePercent"
    params: { "length": 50 }
    timeframe: "5min"
  - name: "5min_trend_alignment"
    type: "EMATrendAlignment"
    params:
      {
        "timeframes": ["5min", "15min", "1H"],
        "length": 50,
        "slope_period": 1,
      }
    timeframe: "5min"

  # --- Micro Volatility & Structure (5min) ---
  - name: "5min_atr_percentile_100"
    type: "ATRPercentile"
    params: { "atr_length": 14, "lookback": 100 }
    timeframe: "5min"
  - name: "5min_atr_slope_pct"
    type: "ATRSlopePercent"
    params: { "length": 14, "slope_period": 1 }
    timeframe: "5min"
  - name: "5min_true_range_zscore_50"
    type: "TrueRangeZScore"
    params: { "window": 50 }
    timeframe: "5min"
  - name: "5min_close_to_hhv_20_pct"
    type: "CloseToHHVPercent"
    params: { "length": 20 }
    timeframe: "5min"
  - name: "5min_close_to_llv_20_pct"
    type: "CloseToLLVPercent"
    params: { "length": 20 }
    timeframe: "5min"
  - name: "5min_hhv_20_slope"
    type: "HHVSlope"
    params: { "length": 20, "slope_period": 1 }
    timeframe: "5min"
  - name: "5min_llv_20_slope"
    type: "LLVSlope"
    params: { "length": 20, "slope_period": 1 }
    timeframe: "5min"
  - name: "5min_volume_sma_ratio_20"
    type: "VolumeSMARatio"
    params: { "length": 20 }
    timeframe: "5min"
  - name: "5min_prior_return_1"
    type: "PriorReturn"
    params: { "window": 1 }
    timeframe: "5min"
  - name: "5min_prior_return_5"
    type: "PriorReturn"
    params: { "window": 5 }
    timeframe: "5min"
  - name: "5min_rsi_14"
    type: "RSI"
    params: { "length": 14 }
    timeframe: "5min"
  - name: "5min_rsi_bias"
    type: "RSIBias"
    params: { "length": 14 }
    timeframe: "5min"
  - name: "5min_adx_14"
    type: "ADX"
    params: { "length": 14 }
    timeframe: "5min"
  - name: "5min_adx_strength"
    type: "ADXStrength"
    params: { "length": 14 }
    timeframe: "5min"
