      fast_length: 10
      slow_length: 20

  - instrument: EURUSD
    start_date: "2023-01-01"
    end_date: "2023-06-30"
    param_overrides:
      fast_length: 12
      slow_length: 25

  - instrument: GBPUSD
    start_date: "2023-01-01"
    end_date: "2023-06-30"
