# Chandelier Stop - Volatility-based Trailing Stop
#
# The Chandelier Stop hangs from the highest high (long) or lowest low (short)
# by a multiple of ATR. It trails price movements but adapts to volatility.
#
# Created by Chuck LeBeau
#
# Default parameters:
# - Multiplier: 3.0x ATR (can use 2.0-4.0 depending on timeframe/volatility)
# - Length: 22 periods (HHV/LLV lookback)
# - ATR Length: 14 periods
#
# Requirements:
# Strategy MUST include these features:
#   - ATR(14) or ATR with matching atr_length
#   - HHV(22) with source: high (or matching length)
#   - LLV(22) with source: low (or matching length)

name: "Chandelier Stop (3.0x ATR, 22 period)"
description: >
  Volatility-based trailing stop that hangs from recent highs/lows.
  Provides protection while allowing trades room to breathe in
  volatile markets. More aggressive than traditional ATR stops.

stop_loss:
  type: indicator
  indicator: chandelier
  params:
    multiplier: 3.0      # ATR multiplier (2.0 = tighter, 4.0 = wider)
    length: 22           # HHV/LLV lookback period
    atr_length: 14       # ATR calculation period

# Optional: Add take-profit if desired
take_profit: null
