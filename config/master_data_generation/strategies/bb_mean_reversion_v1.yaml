strategy_name: "BB_Mean_Reversion_Generic"
metadata:
  strategy_archetype: "mean_reversion"
parameters:
  bb_length: 20
  bb_std_dev: 2.0
features:
  - name: bb
    type: BB
    params:
      length: ${bb_length}
      std: ${bb_std_dev}
    source: close
  # Required features for ATR-based stop REM
  - name: atr_14
    type: ATR
    params:
      length: 14
overlays: [bb_upper, bb_middle, bb_lower]
long_entry_rules:
  - all_of:
      - condition: cross_below
        left:
          field: close
        right:
          ref: bb_lower
long_exit_rules:
  - any_of:
      - condition: cross_above
        left:
          field: close
        right:
          ref: bb_middle
short_entry_rules:
  - all_of:
      - condition: cross_above
        left:
          field: close
        right:
          ref: bb_upper
short_exit_rules:
  - any_of:
      - condition: cross_below
        left:
          field: close
        right:
          ref: bb_middle
