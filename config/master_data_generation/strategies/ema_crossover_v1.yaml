strategy_name: "EMA_Crossover_Generic"
parameters:
  ema_fast_length: 12
  ema_slow_length: 26
  slope_filter: false  # when true, require slope up for longs, down for shorts
  slope_feature: ema_slow  # which feature to use for slope checks
features:
  - name: ema_fast
    type: EMA
    params:
      length: ${ema_fast_length}
    source: close
  - name: ema_slow
    type: EMA
    params:
      length: ${ema_slow_length}
    source: close
overlays: [ema_fast, ema_slow]
long_entry_rules:
  - all_of:
      - condition: cross_above
        left:
          ref: ema_fast
        right:
          ref: ema_slow
long_exit_rules:
  - any_of:
      - condition: cross_below
        left:
          ref: ema_fast
        right:
          ref: ema_slow
short_entry_rules:
  - all_of:
      - condition: cross_below
        left:
          ref: ema_fast
        right:
          ref: ema_slow
short_exit_rules:
  - any_of:
      - condition: cross_above
        left:
          ref: ema_fast
        right:
          ref: ema_slow
