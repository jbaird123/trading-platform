strategy_name: "EMA_Crossover_Generic"
metadata:
  strategy_archetype: "trend_following"
parameters:
  ema_fast_length: 12
  ema_slow_length: 26
  slope_filter: false  # when true, require slope up for longs, down for shorts
  slope_feature: ema_slow  # which feature to use for slope checks
features:
  - name: ema_fast
    type: EMA
    params:
      length: ${ema_fast_length}
    source: close
  - name: ema_slow
    type: EMA
    params:
      length: ${ema_slow_length}
    source: close
  # Required features for Chandelier Stop REM
  - name: atr_14
    type: ATR
    params:
      length: 14
  - name: hhv_22
    type: HHV
    params:
      length: 22
    source: high
  - name: llv_22
    type: LLV
    params:
      length: 22
    source: low
overlays: [ema_fast, ema_slow]
long_entry_rules:
  - all_of:
      - condition: cross_above
        left:
          ref: ema_fast
        right:
          ref: ema_slow
long_exit_rules:
  - any_of:
      - condition: cross_below
        left:
          ref: ema_fast
        right:
          ref: ema_slow
short_entry_rules:
  - all_of:
      - condition: cross_below
        left:
          ref: ema_fast
        right:
          ref: ema_slow
short_exit_rules:
  - any_of:
      - condition: cross_above
        left:
          ref: ema_fast
        right:
          ref: ema_slow
