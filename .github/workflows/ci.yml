name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# The GITHUB_TOKEN needs write permissions to comment on the pull request
permissions:
  pull-requests: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        # SonarCloud needs the full history to assign issues to the right people
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          # We will cache the virtual environment ourselves
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: |
          # Install dependencies, including the project itself in editable mode.
          poetry install --no-interaction

      - name: Run quality checks
        run: |
          poetry run ruff check .
          poetry run ruff format --check .
          poetry run mypy .

      - name: Run tests with coverage
        run: |
          # Generate coverage.xml at repo root for SonarCloud
          poetry run pytest --cov=src --cov-report=xml:coverage.xml

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Be explicit about paths so coverage is picked up on PRs
          args: >
            -Dsonar.sources=src
            -Dsonar.tests=tests
            -Dsonar.python.version=3.10
            -Dsonar.python.coverage.reportPaths=coverage.xml
