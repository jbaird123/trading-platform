name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

# The GITHUB_TOKEN needs write permissions to comment on the pull request
permissions:
  pull-requests: write
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        # SonarCloud needs the full history to assign issues to the right people
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          # We will cache the virtual environment ourselves
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies (with dev)
        run: |
          # Install runtime + dev dependencies, including the project itself.
          poetry install --no-interaction --with dev

      - name: Run quality checks
        run: |
          poetry run ruff check .
          poetry run ruff format --check .
          poetry run mypy .
      - name: Enforce import boundaries
        run: |
          poetry run python tools/check_import_boundaries.py

      - name: Run look-ahead bias detection
        run: |
          echo "Running automated bias detection for all indicators..."
          poetry run pytest tests/strategy/test_indicator_bias_detection.py \
                           tests/strategy/test_indicator_safety.py \
                           -v \
                           --tb=short \
                           -m "not slow"
          echo "✓ All indicators passed bias detection tests"

      - name: Run tests with coverage
        run: |
          # Generate coverage.xml at repo root for SonarCloud and HTML for humans
          poetry run pytest \
                            --cov=src/trading_platform \
                            --cov-config=.coveragerc \
                            --cov-fail-under=100 \
                            --cov-report=xml:coverage.xml \
                            --cov-report=html

      - name: Generate coverage summary
        if: always()
        run: |
          poetry run coverage report -m | tee coverage_summary.txt

      - name: Upload coverage artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage
          path: |
            coverage.xml
            htmlcov/
            coverage_summary.txt

      - name: SonarCloud Scan
        uses: SonarSource/sonarcloud-github-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          SONAR_TOKEN: ${{ secrets.SONAR_TOKEN }}
        with:
          # Be explicit about paths so coverage is picked up on PRs
          args: >
            -Dsonar.sources=src/trading_platform
            -Dsonar.tests=tests
            -Dsonar.python.version=3.10
            -Dsonar.python.coverage.reportPaths=coverage.xml
