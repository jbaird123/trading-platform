name: Python CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.10"

      - name: Install Poetry
        uses: snok/install-poetry@v1
        with:
          # We will cache the virtual environment ourselves
          virtualenvs-create: true
          virtualenvs-in-project: true

      - name: Load cached venv
        id: cached-poetry-dependencies
        uses: actions/cache@v4
        with:
          path: .venv
          key: venv-${{ runner.os }}-${{ hashFiles('**/poetry.lock') }}

      - name: Install dependencies
        run: |
          # The --no-root flag avoids installing the project itself, which is not needed for linting/testing.
          # The if statement ensures this only runs when the cache is not hit.
          poetry install --no-interaction --no-root

      - name: Run quality checks and tests
        run: |
          poetry run ruff check .
          poetry run ruff format --check .
          poetry run mypy .
          poetry run pytest
